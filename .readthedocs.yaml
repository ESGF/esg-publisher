# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"

  # Install esgvoc for documentation build
  jobs:
    post_install:
      - esgvoc use universe@latest
      - esgvoc use cmip6@latest

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - dev
    - requirements: docs/requirements.txt

sphinx:
  configuration: docs/conf.py
  fail_on_warning: false  # Set to true after fixing all warnings

# Build documentation in additional formats
formats:
  - pdf
  - epub
